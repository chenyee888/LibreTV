name: Smoke test deployed LibreTV on Netlify
on:
  push:
    branches:
      - work/netlify-smoke
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the automatic Netlify deployment
        run: sleep 45
      - name: Check the deployed API and built-in sources
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if curl -fsS --max-time 15 https://libretv888.netlify.app/api/status -o status.json; then
              jq '{version, passwordRequired, defaultSources: [.defaultSources[]? | {key, name, adapter}]}' status.json
              jq -e '[.defaultSources[]? | select(.key == "spider_gulu" or .key == "spider_orange")] | length == 2' status.json
              exit 0
            fi
            echo "Site is not ready yet (attempt $attempt)"
            sleep 15
          done
          echo "Netlify site did not expose the expected API after retries"
          exit 1
