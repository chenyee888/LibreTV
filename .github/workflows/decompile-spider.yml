name: Decompile TVBox Spider for source adapter
on:
  push:
    branches:
      - work/spider-decompile
permissions:
  contents: read
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Download JADX and Spider JAR
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest)"
          jadx_url="$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name | test("jadx.*\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$jadx_url"
          curl -fL "$jadx_url" -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x "$(find jadx -type f -name jadx | head -n1)"
          curl -fL https://raw.githubusercontent.com/qist/tvbox/master/jar/spider.jar -o spider.jar
          mkdir -p decompiled
          set +e
          "$(find "$PWD/jadx" -type f -name jadx | head -n1)" -d decompiled spider.jar
          jadx_status=$?
          set -e
          echo "JADX exit code: $jadx_status (nonzero can mean partial decode; retain output)"
          test -d decompiled
      - name: Probe public source configuration and Gulu gateway
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 'https://123-1349250429.cos.ap-shanghai.myqcloud.com/app.txt' -o app.txt
          echo 'AppDrama public config:'
          cat app.txt
          domain="$(jq -r '.domain // empty' app.txt)"
          if [ -n "$domain" ]; then
            echo "AppDrama domain resolved: $domain"
            curl -sSIL --max-time 15 "https://$domain/api/v5/find/app/zone" | head -n 12 || true
          else
            echo 'No domain field found in app.txt'
          fi
          echo 'Gulu gateway reachability:'
          curl -sSIL --max-time 15 'http://103.45.132.22:19987/app/bn/v2' | head -n 12 || true
      - name: Upload decompiled sources
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-spider-decompiled
          path: |\n            decompiled/\n            app.txt
          retention-days: 3
